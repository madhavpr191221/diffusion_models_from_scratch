[project]
name = "diffusion-models-from-scratch"
version = "0.1.0"
description = "A first-principles, unconditional DDPM learning project using EuroSAT RGB"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "numpy",
    "Pillow",
    "matplotlib",
    "fastapi",
    "uvicorn[standard]",
    "datasets==5.1.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddpm_eurosat"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
